<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Campaign — EnvBike</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .back-link {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }
        h1 { margin: 0 0 20px; font-size: 1.4rem; }
        .field { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
        }
        textarea { min-height: 90px; resize: vertical; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .btn-primary { background: var(--accent); color: #ffffff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--border); color: var(--text); }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="/campaign">&larr; Back to Campaigns</a>
        <div class="card">
            <h1>Edit Campaign</h1>
            <form action="/campaign" method="post">
                <input type="hidden" name="id" value="{{ campaign.id }}">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" value="{{ campaign.name or '' }}">
                </div>
                <div class="field">
                    <label for="author">Author</label>
                    <input type="text" name="author" id="author" value="{{ campaign.author or '' }}">
                </div>
                <div class="field">
                    <label for="start">Start</label>
                    <input type="datetime-local" name="start" id="start" value="{{ campaign.start.isoformat(timespec='minutes') }}" required>
                </div>
                <div class="field">
                    <label for="end">End (leave empty for live campaign)</label>
                    <input type="datetime-local" name="end" id="end" value="{% if campaign.end %}{{ campaign.end.isoformat(timespec='minutes') }}{% endif %}">
                </div>
                <div class="field">
                    <label for="description">Description</label>
                    <textarea name="description" id="description">{{ campaign.description or '' }}</textarea>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="/campaign" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
